services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anokhi-pehel-app
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_URL=mongodb://mongo:27017/anokhi-pehel
      - MONGO_URL=mongodb://mongo:27017/anokhi-pehel
      - JWT_SECRET=docker_dev_secret_key_minimum_length_32_characters
      - JWT_KEY=docker_dev_secret_key_minimum_length_32_characters
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: anokhi-pehel-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo-data:
